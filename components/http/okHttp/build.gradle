plugins {
    // Apply the java-library plugin to add support for Java Library
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    id 'com.github.spotbugs'
    id 'com.diffplug.spotless'
}

java {
    modularity.inferModulePath = true
    withSourcesJar()
    withJavadocJar()
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // report is always generated after tests run
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
    reports.xml.required = true
}

jacoco {
    toolVersion = "0.8.12"
}

spotbugsMain {
    excludeFilter = file("spotBugsExcludeFilter.xml")
    reports {
        html {
            required
            outputLocation = file("$buildDir/reports/spotbugs/main/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
    }
}

spotbugsTest {
    excludeFilter = file("spotBugsExcludeFilter.xml")
    reports {
        html {
            required
            outputLocation = file("$buildDir/reports/spotbugs/test/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
    }
}

sourceSets {
    main {
        java {
            exclude 'pom.xml'
        }
    }
}

// In this section you declare where to find the dependencies of your project
repositories {
    // You can declare any Maven/Ivy/file repository here.
    mavenCentral()
}

apply from: "gradle/dependencies.gradle"

def pomConfig = {
    licenses {
        license([:]) {
            name "MIT License"
            url "http://opensource.org/licenses/MIT"
            distribution "repo"
        }
    }
}

//Publishing tasks-
//Maven Central Snapshot: publishMavenPublicationToMavenRepository
//Maven Central Release: publishmavenPublicationToMaven2Repository

tasks.jar {
    manifest {
        attributes('Automatic-Module-Name': project.property('mavenGroupId'))
    }
}

publishing {

    publications {
        maven(MavenPublication) {
            customizePom(pom)
            groupId = project.property('mavenGroupId')
            artifactId = project.property('mavenArtifactId')
            version = "${mavenMajorVersion}.${mavenMinorVersion}.${mavenPatchVersion}${mavenCentralSnapshotArtifactSuffix}"
            from components.java
            pom.withXml {
                // Gradle selects an OkHttp variant from module metadata; Maven needs the JVM artifact.
                def okHttpDependencies = asNode().dependencies.dependency.findAll {
                    it.groupId.text() == 'com.squareup.okhttp3' && it.artifactId.text() == 'okhttp'
                }
                if (okHttpDependencies.size() != 1) {
                    throw new GradleException('Expected exactly one OkHttp dependency in the Maven POM')
                }
                okHttpDependencies[0].artifactId[0].setValue('okhttp-jvm')
                def pomFile = file("${project.buildDir}/generated-pom.xml")
                writeTo(pomFile)
            }
        }
    }
    repositories {
        maven {
            name = "ADO"
            url = layout.buildDirectory.dir("publishing-repository")
        }
    }
}

tasks.register('verifyOkHttpPublicationMetadata') {
    dependsOn 'generatePomFileForMavenPublication', 'generateMetadataFileForMavenPublication'
    doLast {
        def okHttpModules = ['okhttp', 'okhttp-jvm', 'okhttp-android']
        def expectedVersion = libs.versions.okhttp.get()
        def pomFile = layout.buildDirectory.file('generated-pom.xml').get().asFile
        def pom = new groovy.xml.XmlSlurper().parse(pomFile)
        def pomDependencies = pom.dependencies.dependency.findAll {
            it.groupId.text() == 'com.squareup.okhttp3' && it.artifactId.text() in okHttpModules
        }
        if (pomDependencies.size() != 1 ||
            pomDependencies[0].artifactId.text() != 'okhttp-jvm' ||
            pomDependencies[0].version.text() != expectedVersion ||
            pomDependencies[0].scope.text() != 'compile' ||
            !pomFile.getText('UTF-8').contains('do_not_remove: published-with-gradle-metadata')) {
            throw new GradleException('Maven POM must expose okhttp-jvm and the Gradle metadata marker')
        }

        def moduleFile = layout.buildDirectory.file('publications/maven/module.json').get().asFile
        def metadata = new groovy.json.JsonSlurper().parse(moduleFile)
        ['apiElements', 'runtimeElements'].each { variantName ->
            def variant = metadata.variants.find { it.name == variantName }
            def dependencies = variant?.dependencies?.findAll {
                it.group == 'com.squareup.okhttp3' && it.module in okHttpModules
            }
            if (dependencies == null || dependencies.size() != 1 ||
                dependencies[0].module != 'okhttp' ||
                dependencies[0].version.requires != expectedVersion) {
                throw new GradleException("Gradle ${variantName} must expose the generic OkHttp dependency")
            }
        }
    }
}
tasks.named('check') {
    dependsOn 'verifyOkHttpPublicationMetadata'
}

signing {
    sign publishing.publications.maven
}
tasks.withType(Sign)*.enabled = mavenCentralPublishingEnabled.toBoolean()

def fixAscNames = { name ->
    if(name.contains('pom')) {
        "${project.property('mavenArtifactId')}-${mavenMajorVersion}.${mavenMinorVersion}.${mavenPatchVersion}.pom.asc"
    } else {
        name.replace('microsoft-kiota-java-http-okHttp', "${project.property('mavenArtifactId')}-${mavenMajorVersion}.${mavenMinorVersion}.${mavenPatchVersion}")
    }
}

compileJava {
  options.compilerArgs << "-parameters"
  sourceCompatibility = '1.8'
  targetCompatibility = '1.8'
}

def getVersionCode() {
    return mavenMajorVersion.toInteger() * 10000 + mavenMinorVersion.toInteger() * 100 + mavenPatchVersion.toInteger()
}

def getVersionName() {
    return "${mavenMajorVersion}.${mavenMinorVersion}.${mavenPatchVersion}${mavenArtifactSuffix}"
}

artifacts {
    archives jar
}

def customizePom(pom) {
    pom.withXml {
        def root = asNode()

        root.dependencies.removeAll { dep ->
            dep.scope == "test"
        }

        root.children().last() + {
            resolveStrategy = Closure.DELEGATE_FIRST

            description 'Microsoft Kiota-Http with okHttp'
            name 'Microsoft Kiota-Java Http-okHttp'
            url 'https://github.com/microsoft/kiota-java'
            organization {
                name 'Microsoft'
                url 'https://github.com/microsoft/kiota-java'
            }
            issueManagement {
                system 'GitHub'
                url 'https://github.com/microsoft/kiota-java/issues'
            }
            licenses {
                license {
                    name "MIT License"
                    url "http://opensource.org/licenses/MIT"
                    distribution "repo"
                }
            }
            scm {
                url 'https://github.com/microsoft/kiota-java'
                connection 'scm:git:git://github.com/microsoft/kiota-java.git'
                developerConnection 'scm:git:ssh://git@github.com:microsoft/kiota-java.git'
            }
            developers {
                developer {
                    name 'Microsoft'
                }
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (project.rootProject.file('local.properties').exists()) {
        Properties properties = new Properties()
        properties.load(project.rootProject.file('local.properties').newDataInputStream())
        tasks.withType(Sign)*.enabled = (properties.containsKey('enableSigning')) ? properties.getProperty('enableSigning').toBoolean() : false
        allprojects { ext."signing.keyId" = properties.getProperty('signing.keyId') }
        allprojects { ext."signing.secretKeyRingFile" = properties.getProperty('signing.secretKeyRingFile') }
        allprojects { ext."signing.password" = properties.getProperty('signing.password') }
    }
}

model {
    tasks.generatePomFileForMavenPublication {
        destination = file("${project.buildDir}/generated-pom.xml")
    }
}

apply from: file('../../../spotless.groovy')
